[package]
name = "qvto-vm"
description = "Bytecode interpreter: frames, mappings, traces and resolve, extents, exceptions, log and assert"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Compat mode: Eclipse QVTo's collection orders and identity hashes (simoxide-jcompat-exact; no
# licence granted, builds with it must not be distributed: LICENSES, section 7).
compat = ["qvto-runtime/compat"]
default = ["emf"]
# `ObjHandle` for qvto-emf's object ids
emf = ["dep:qvto-emf"]

[dependencies]
qvto-model.workspace = true
qvto-types.workspace = true
qvto-sema.workspace = true
qvto-bytecode.workspace = true
qvto-runtime.workspace = true
qvto-emf = { workspace = true, optional = true }
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
# the tests check compat mode
qvto-runtime = { workspace = true, features = ["compat"] }
qvto-emf.workspace = true
qvto-syntax.workspace = true
