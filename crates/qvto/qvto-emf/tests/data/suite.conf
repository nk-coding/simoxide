# Resource-set configuration for the Eclipse test-suite models (paths relative to the repository
# root). Read by tests/suite_models.rs and by oracle/src/EmfOracle.java.
map platform:/plugin/org.eclipse.ocl/ reference/eclipse-ocl/plugins/org.eclipse.ocl/
map platform:/plugin/org.eclipse.ocl.ecore/ reference/eclipse-ocl/plugins/org.eclipse.ocl.ecore/
map platform:/plugin/org.eclipse.m2m.qvt.oml.ecore.imperativeocl/ reference/eclipse-qvto/plugins/org.eclipse.m2m.qvt.oml.ecore.imperativeocl/
map platform:/plugin/org.eclipse.m2m.qvt.oml/ reference/eclipse-qvto/plugins/org.eclipse.m2m.qvt.oml/
map platform:/plugin/org.eclipse.m2m.qvt.oml.samples/ reference/eclipse-qvto/plugins/org.eclipse.m2m.qvt.oml.samples/
mmroot reference/eclipse-qvto
mmroot reference/eclipse-ocl
alias platform:/plugin/org.eclipse.emf.ecore/model/Ecore.ecore http://www.eclipse.org/emf/2002/Ecore
