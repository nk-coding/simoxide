[package]
name = "qvto-simoxide"
description = "Runs qvto-rs on SimOxide's model graph: a ModelStore over simoxide_model::raw::Graph, a metamodel registry from SimOxide's generated tables, a change journal"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
qvto-model.workspace = true
qvto-emf.workspace = true
qvto-runtime.workspace = true
qvto-vm.workspace = true
qvto.workspace = true
simoxide-model.workspace = true

[dev-dependencies]
qvto-paths.workspace = true
qvto-sema.workspace = true
qvto-testkit = { workspace = true, features = ["compat"] }
qvto = { workspace = true, features = ["compat"] }

[features]
# Compat mode: Eclipse QVTo's collection orders and identity hashes (simoxide-jcompat-exact; no
# licence granted, builds with it must not be distributed: LICENSES, section 7).
compat = ["qvto/compat", "qvto-vm/compat", "qvto-runtime/compat"]
