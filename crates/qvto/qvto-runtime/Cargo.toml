[package]
name = "qvto-runtime"
description = "Runtime values, OCL collections, Java-compatible hashing and formatting, standard library implementations, blackbox trait"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
qvto-model.workspace = true
qvto-types.workspace = true
ryu = "1.0.23"
# insertion-ordered hash maps (`coll::LinkedMap`)
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
