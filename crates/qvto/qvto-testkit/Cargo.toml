[package]
name = "qvto-testkit"
description = "Conformance runner over the Eclipse QVTo test suite and differential testing against the Java reference"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# HotSpot identity-hash sequences for tape replay (feature `compat`; no licence granted)
simoxide-jcompat-exact = { workspace = true, optional = true }
qvto-paths.workspace = true
# the Java runner's batch process, the seed agent, result directories and their comparison
simoxide-oraclekit.workspace = true
qvto-emf.workspace = true
qvto-model.workspace = true

[features]
# Compat mode: Eclipse QVTo's collection orders and identity hashes (simoxide-jcompat-exact; no
# licence granted, builds with it must not be distributed: LICENSES, section 7).
compat = ["dep:simoxide-jcompat-exact"]

[dev-dependencies]
# third-party models behind git submodules: skip without them (third_party/README.md)
simoxide-thirdparty.workspace = true
qvto-testkit = { path = ".", features = ["compat"] }
