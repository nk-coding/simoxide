[package]
name = "qvto-cli"
description = "Command line: run, check, conform, bench"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "qvto"
path = "src/main.rs"

[dependencies]
qvto.workspace = true
qvto-testkit.workspace = true
qvto-emf.workspace = true
qvto-sema.workspace = true
qvto-runtime.workspace = true
qvto-model.workspace = true
qvto-vm.workspace = true
qvto-bytecode.workspace = true
qvto-syntax.workspace = true
# building the Java runner on demand (`qvto bench --java`)
simoxide-oraclekit.workspace = true
# Sampling profiler for `qvto bench --profile` (SIGPROF, works without perf events).
pprof = { version = "0.15", optional = true, default-features = false, features = ["flamegraph"] }

[features]
# Compat mode: Eclipse QVTo's collection orders and identity hashes (simoxide-jcompat-exact; no
# licence granted, builds with it must not be distributed: LICENSES, section 7).
compat = ["qvto/compat", "qvto-vm/compat", "qvto-runtime/compat", "qvto-testkit/compat"]
profile = ["dep:pprof"]

[dev-dependencies]
qvto-paths.workspace = true
qvto-testkit = { workspace = true, features = ["compat"] }
qvto = { workspace = true, features = ["compat"] }
