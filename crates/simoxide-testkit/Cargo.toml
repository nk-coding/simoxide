[package]
name = "simoxide-testkit"
description = "Differential testing infrastructure for SimOxide: palladio-trace/1 model, serializer and differ, tape replay, measurement comparison, reference runner, random PCM model generator and fuzz driver"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# third-party models behind git submodules: corpus entries without them are skipped
simoxide-thirdparty.workspace = true
simoxide-model = { workspace = true }
# the statistical equivalence harness (`equiv`) runs both modes in process
simoxide-sim = { workspace = true, features = ["fast"] }
simoxide-jcompat = { workspace = true }
# refsim's batch driver, scratch directories, expected files (.gz)
simoxide-oraclekit = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
libm = "0.2"

[dev-dependencies]
# the harness tests compare with reference outputs bit for bit
simoxide-random = { path = "../simoxide-random", features = ["hotspot-math"] }
simoxide-sim = { workspace = true, features = ["exact"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
default = []
# The exact mode in process (`equiv` with `Mode::Exact`); see simoxide-sim's `exact`.
exact = ["simoxide-sim/exact"]
# Bit-exact HotSpot Math.log/exp (GPL-2.0-only code; binaries built with it must not be
# distributed, see simoxide-random's `hotspot-math` feature).
hotspot-math = ["simoxide-sim/hotspot-math"]

[[bin]]
name = "simoxide-fuzz"
path = "src/bin/simoxide-fuzz.rs"
