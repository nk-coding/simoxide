[package]
name = "simoxide-reconf"
description = "Runtime model changes for SimOxide: the QVTo host (transformations on a run's model, SimuLizar rule sets, SPD adjustments), change sets from journals and direct edits, applied to a running simulation"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
simoxide-model = { workspace = true }
simoxide-sim = { workspace = true }
simoxide-spd = { workspace = true, optional = true, features = ["sim"] }
qvto-model.workspace = true
qvto-emf.workspace = true
qvto.workspace = true
qvto-vm.workspace = true
qvto-runtime.workspace = true
qvto-sema.workspace = true
# snapshots (feature `snapshot`; MIT/Apache-2.0)
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
simoxide-sim = { workspace = true, features = ["fast", "exact", "snapshot"] }
# the snapshot tests
simoxide-reconf = { path = ".", features = ["snapshot"] }
serde_json = "1"
# the corpus test compares with the Java runner's results: compat mode and identity-hash tapes
qvto = { workspace = true, features = ["compat"] }
qvto-testkit = { workspace = true, features = ["compat"] }
qvto-runtime = { workspace = true, features = ["compat"] }
qvto-paths.workspace = true
# the reference's expected outputs (gzip'ed traces)
simoxide-testkit = { path = "../simoxide-testkit" }

[features]
default = ["spd"]
# QVTo's compat mode (Eclipse's Java `HashMap` orders) for the transformations. No licence covers
# builds with it (LICENSES, section 7).
compat = ["qvto/compat", "qvto-vm/compat", "qvto-runtime/compat"]
# The exact modes: SimuLizar-exact in simoxide-sim, and QVTo's compat mode for the
# transformations (Java orders of unordered features). No licence covers builds with it
# (LICENSES, section 7).
exact = ["simoxide-sim/exact", "compat"]
# The SPD adjuster (`QvtoAdjuster`, an implementation of `simoxide_spd::Adjuster`).
spd = ["dep:simoxide-spd"]
# Snapshots of runs with reconfiguration rules (`RulesRun::snapshot_to`, `RulesRun::restore_from`)
# and of a run's QVTo state (`QvtoRun::save_state`); DESIGN-SPD.md N1.
snapshot = ["dep:serde", "simoxide-sim/snapshot", "simoxide-spd?/snapshot"]
