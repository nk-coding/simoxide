[package]
name = "simoxide-reconf"
description = "Runtime model changes for SimOxide: change sets from the QVTo adapter's journal and direct edits, applied to a running simulation"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
simoxide-model = { workspace = true }
simoxide-sim = { workspace = true }
qvto-simoxide.workspace = true
qvto-model.workspace = true

[dev-dependencies]
simoxide-sim = { workspace = true, features = ["fast", "exact"] }
serde_json = "1"

[features]
# The exact modes: SimuLizar-exact in simoxide-sim, and QVTo's compat mode for the rules
# (Java orders of unordered features). No licence covers builds with it (LICENSES, section 7).
exact = ["simoxide-sim/exact", "qvto-simoxide/compat"]
