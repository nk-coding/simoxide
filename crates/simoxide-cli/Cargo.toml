[package]
name = "simoxide-cli"
description = "Command line front end of simoxide-sim (run a PCM model, emit trace, tape and measurements, benchmark)"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "simoxide"
path = "src/main.rs"

[dependencies]
# snapshots (`--snapshot`, `simoxide resume`): always on in the CLI
simoxide-sim = { workspace = true, features = ["snapshot"] }
simoxide-model = { workspace = true }
simoxide-emf = { workspace = true }
simoxide-reconf = { workspace = true, optional = true }
simoxide-spd = { workspace = true, optional = true, features = ["sim"] }
mimalloc = { version = "0.1", optional = true, default-features = false }
pprof = { version = "0.15", optional = true, default-features = false, features = ["flamegraph"] }

[features]
# The default build is the distributable EPL build: fast mode only (`--mode fast`, the default).
# `--features exact,hotspot-math` is the local exact build (byte-identical to the reference); its
# binaries must not be distributed (LICENSES, sections 4 and 7).
default = ["fast", "spd"]
fast = ["simoxide-sim/fast", "simoxide-spd?/fast"]
# SimuLizar-exact mode (`--mode exact`).
exact = ["simoxide-sim/exact", "simoxide-reconf?/exact", "simoxide-spd?/exact"]
# Scaling policy definitions (`.spd` next to the model): the SPD interpreter runs with the
# simulation (`--spd-log`, `--spd-quirks`). With `reconfiguration` the adjustments run (Slingshot's
# MainTransformation, DESIGN-SPD.md P2); without it they are decisions only.
spd = ["dep:simoxide-spd", "simoxide-spd/snapshot"]
# `simoxide bench --profile out.svg`: in-process sampling profiler (SIGPROF), flame graph output.
profile = ["dep:pprof"]
# Use mimalloc as the global allocator of `simoxide` and `simoxide-bench`.
mimalloc = ["dep:mimalloc"]
# Bit-exact HotSpot Math.log/exp (GPL-2.0-only code; binaries built with it must not be
# distributed, see simoxide-random's `hotspot-math` feature).
hotspot-math = ["simoxide-sim/hotspot-math"]
# Runtime model changes (reconfiguration rules, SPD adjustments; DESIGN-SPD.md F2-F4, R1, P2): builds
# `simoxide-reconf` (and through it the QVTo engine, crates/qvto) for `simoxide run --rules` and
# `simoxide resume`. Whether it joins the defaults is open (DESIGN-SPD.md U2).
reconfiguration = ["dep:simoxide-reconf", "simoxide-reconf/snapshot"]

[dev-dependencies]
# the SPD decision logs of the CLI tests
serde_json = "1"
