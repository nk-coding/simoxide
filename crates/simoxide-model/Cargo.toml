[package]
name = "simoxide-model"
description = "Loads Palladio Component Model (PCM 5.2) XMI files into a typed, index-based representation, reproducing EMF's loading semantics"
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
simoxide-emf = { workspace = true }
simoxide-emf-core = { workspace = true }
simoxide-jcompat = { workspace = true }
quick-xml = "0.38"
memchr = "2"
# `serde` feature: Serialize/Deserialize for the typed ids (run-state snapshots; MIT/Apache-2.0)
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "pcm-dump"
path = "examples/pcm-dump.rs"

[dependencies.pprof]
version = "0.15"
optional = true
default-features = false

[features]
# Serialize/Deserialize for the typed ids (`ContainerId`, ...), for snapshots of runs
# (DESIGN-SPD.md N1). The graph (`raw`) has none: its XMI is the snapshot form.
serde = ["dep:serde"]
# `load-bench bench --profile out.folded`: sampling profiler for the loading benchmark.
profile = ["dep:pprof"]
