# Builds the VitePress site in docs/ and publishes it to GitHub Pages
# (https://nk-coding.github.io/simoxide/). Needs Settings > Pages > Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - corpus/INDEX.md
      - bench/compare/results/*.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Build
        working-directory: docs
        env:
          DOCS_BASE: /simoxide/
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
